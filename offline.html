<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#171a21" />
    <meta name="color-scheme" content="dark" />
    <title>Offline · np-track</title>
    <link rel="icon" href="./assets/icons/app-icon-32.png" sizes="32x32" type="image/png" />
    <style>
      * { box-sizing: border-box; }
      body {
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 1.25rem;
        color: #f1f5f9;
        background:
          radial-gradient(circle at 30% 20%, rgba(50, 100, 112, .3), transparent 28rem),
          #1b2838;
        font-family: Arial, Helvetica, sans-serif;
      }
      main {
        width: min(100%, 28rem);
        padding: 2rem;
        text-align: center;
        border: 1px solid rgba(102, 192, 244, .16);
        border-radius: 1.5rem;
        background: #171f2b;
        box-shadow: 0 20px 50px rgba(0, 0, 0, .3);
      }
      img { width: 5rem; height: 5rem; border-radius: 1.25rem; }
      h1 { margin: 1.25rem 0 .5rem; font-size: 1.8rem; }
      p { margin: 0; color: #94a3b8; line-height: 1.6; }
      a {
        display: inline-flex;
        min-height: 2.75rem;
        margin-top: 1.5rem;
        align-items: center;
        padding: .75rem 1.25rem;
        color: #171a21;
        border-radius: .75rem;
        background: #66c0f4;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="./assets/icons/app-icon-192.png" alt="" />
      <h1>You’re offline</h1>
      <p>Reconnect to search PSN profiles. Pages and images you opened before may still be available.</p>
      <a href="./">Try again</a>
    </main>
  </body>
</html>
